<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>どこ押すねん｜夕刊みなと</title>
<style>
/* 色は :root、端末の横幅は .stage.playing と .phone で調整できます。 */
:root{color-scheme:light;--ink:#202727;--night:#141b22;--blue:#244558;--paper:#f8f5ed;--green:#d4f99b}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 48% 0,#354751,#141b22 70%);color:#eff4f5;min-height:100vh;font:15px/1.65 "Noto Sans JP",Meiryo,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.56}
:focus-visible{outline:3px solid #168de4;outline-offset:3px}
.top{max-width:1296px;margin:auto;padding:22px 24px 13px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:1.45rem;font-weight:900;letter-spacing:.075em}
.stats{display:flex;gap:8px;font-size:.79rem;font-variant-numeric:tabular-nums}
.stats span{background:#202d36;border:1px solid #53636a;border-radius:5px;padding:4px 9px}
.stage{max-width:1296px;margin:auto;padding:16px 24px 34px;display:grid;grid-template-columns:minmax(0,1fr);gap:26px;align-items:start}
.stage.playing{grid-template-columns:300px minmax(0,1fr)}
/* 左端末のチャット画面 */
.phone{width:min(100%,300px);justify-self:center;border:5px solid #080d12;border-radius:30px;background:#ecf2ec;color:var(--ink);overflow:hidden;box-shadow:0 18px 42px #0006;display:flex;flex-direction:column}
.phone-top{padding:10px 16px 11px;background:#233b37;color:white}
.notch{width:70px;height:7px;border-radius:10px;background:#101c1b;margin:0 auto 9px}
.contact{display:flex;align-items:center;gap:8px;font-weight:750}
.avatar{display:grid;place-items:center;border-radius:50%;width:30px;height:30px;background:#b8d4a7;color:#183521}
.messages{height:330px;overflow:auto;overscroll-behavior:contain;padding:15px 12px;display:flex;flex-direction:column;gap:9px}
.bubble{align-self:flex-start;max-width:94%;border-radius:3px 13px 13px;background:#fff;padding:8px 11px;font-size:.84rem;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--green);border-radius:13px 3px 13px 13px}
.bubble a{font-weight:800;color:#174d7d;text-underline-offset:3px;display:block}
.bubble small{display:block;color:#52656b;margin-top:2px}
.reply{background:#fff;border-top:1px solid #cddacf;padding:9px 10px}
.reply label{font-size:.76rem;display:block;font-weight:700}
.reply input{width:100%;min-width:0;border:1px solid #98aaa1;border-radius:6px;padding:5px 7px;font-size:16px}
.primary{border:0;border-radius:6px;background:#214b41;color:white;padding:6px 10px;font-weight:750;white-space:nowrap}
.result{background:#e0f3d9;padding:11px;margin-top:7px;font-size:.85rem}
.result p{margin:0 0 7px}
/* 右端末のニュース画面。 .scroll がサイト内のスクロール領域です。 */
.pc{min-width:0;background:#121a20;border:3px solid #0c141a;border-radius:13px;padding:5px;box-shadow:0 22px 45px #0006;animation:arrive .35s ease-out}
@keyframes arrive{from{opacity:0;transform:translateX(16px)}}
.chrome{display:flex;gap:6px;align-items:center;background:#dbe2e5;color:#19262d;border-radius:7px 7px 0 0;padding:6px}
.chrome button{border:0;background:#eef2f3;border-radius:4px;min-width:35px;min-height:32px}
.location-bar{flex:1;min-width:0;background:white;border-radius:4px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:.74rem/1.7 ui-monospace,monospace}
.screen{position:relative;isolation:isolate;background:var(--paper);color:var(--ink);height:clamp(370px,74vh,680px);overflow:hidden}
.scroll{height:100%;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding-bottom:70px}
.mast{padding:12px 17px;background:#203d4e;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mast span,.crumb,.meta{font-size:.74rem}
.nav{border-bottom:1px solid #bebbb1;padding:5px 16px;color:#3d4b53;font-size:.76rem}
article{padding:17px;max-width:780px;margin:auto}
h1,h2,p{margin-top:0}
h1{font:900 clamp(1.4rem,4vw,2.3rem)/1.3 Georgia,"Yu Mincho",serif;margin-bottom:9px}
h2{font-size:1.04rem;margin-bottom:8px}
.crumb,.meta{color:#526369;margin-bottom:10px}
.row{width:100%;text-align:left;padding:13px 7px;border:0;border-bottom:1px solid #c4c5b9;background:none;color:#213c4a;display:block}
.row:hover{background:#e8eee9}
.row strong,.row small{display:block}
.story{background:#fffdf7;border:1px solid #d6d3c8;padding:13px}
.story p:last-child{margin-bottom:0}
.slot:empty{display:none}
.native{width:100%;display:block;text-align:left;border:1px solid #d6d3c8;border-radius:4px;background:#fffdf7;color:#213c4a;padding:9px}
.native strong,.native small{display:block}
.native strong{text-decoration:underline;text-underline-offset:3px}
.native small,.native .promo-label{color:#526369}
.promo-label{font-size:.66rem;border:1px solid currentColor;border-radius:3px;padding:0 4px}
.inline{margin:10px 0}
/* 広告はニュースの上に重ね、何もない部分では記事を操作できます。 */
.layer{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.layer button,.layer a{pointer-events:auto}
.promo-close{background:#fff;color:#1a2430;border:1px solid #9c9da8;min-width:32px;min-height:32px;line-height:1;border-radius:4px;font-weight:900}
.promo-action{border:1px solid #0004;background:#eef3f6;color:#18384c;border-radius:5px;padding:6px 10px;font-weight:900}
.promo-card{pointer-events:auto;position:absolute;padding:11px;border-radius:8px;box-shadow:0 8px 22px #0006;max-width:calc(100% - 16px)}
.promo-card strong{display:block;font-size:1.05rem}
.promo-card p{margin:4px 0 8px;font-size:.82rem}
.promo-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:5px}
.sticky-promo{left:7px;bottom:7px;display:flex;padding:0;background:#e5edf2;color:#223f52}
.sticky-promo .promo-action{background:none;border:0}
.modal-promo{pointer-events:auto;position:absolute;inset:0;display:grid;place-items:center;background:#142130ba;padding:14px}
.modal-promo .promo-card{position:relative;width:min(100%,375px);background:#5e1c6c;color:white;padding:15px}
.modal-promo .promo-card strong{font-size:1.42rem}
.slide-promo{right:7px;bottom:53px;background:#fff;color:#263047;border:1px solid #a5adba;width:285px;animation:slide .45s ease-out}
@keyframes slide{from{transform:translateY(115%)}}
.moving-promo{right:10px;top:64px;color:#31135b;background:linear-gradient(130deg,#ffdc55,#ff90d2 50%,#9affed);width:250px;animation:travel 2.6s ease-in-out infinite alternate}
@keyframes travel{0%{transform:translate(0,0) rotate(-6deg)}100%{transform:translate(-28px,56px) rotate(6deg)}}
.virus{border:2px outset #dce5ef;background:#e2e7ef;color:#171722;padding:0;width:230px;border-radius:2px;animation:arrive .16s ease-out}
.virus .promo-title{background:#12469e;color:#fff;padding:3px 4px 3px 7px;font:700 .76rem/1.3 monospace;margin:0}
.virus .promo-close{border-radius:0;min-width:27px;min-height:27px}
.virus .body{padding:7px}
.virus .body strong{color:#8d1725;font-size:.82rem}
.virus .promo-action{font-size:.73rem;padding:3px 7px}
@media(max-width:690px){.top,.stage{padding-inline:10px}.moving-promo{width:206px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
.stage.playing{grid-template-columns:minmax(0,300px) minmax(0,410px);justify-content:center;align-items:start}
.pc{width:100%;justify-self:center}
.screen{height:clamp(350px,70dvh,620px)}
.site-link{color:inherit;text-underline-offset:3px}
.mast .site-link{font:900 1.45rem/1.15 Georgia,"Yu Mincho",serif;letter-spacing:.1em}
.nav{display:flex;flex-wrap:wrap;gap:4px 12px}
.nav .site-link,.crumb .site-link{display:inline-block;padding:3px 0}
.crumb .site-link{color:#22516a}
.row{display:block;text-decoration:none}
.row strong{text-decoration:underline;text-underline-offset:3px}
.reply select{width:100%;min-height:35px;border:1px solid #98aaa1;border-radius:6px;background:white;font:inherit;font-size:16px;padding:4px 7px}
.field{margin:0 0 7px}
.app-switch{display:none}
.app-switch button{flex:1;background:#253841;color:#fff;border:1px solid #53636a;border-radius:8px;padding:8px 5px;font-weight:750}
.app-switch button[aria-pressed="true"]{background:#d4f99b;color:#15291e;border-color:#d4f99b}
/* 動く広告。揺れの間隔は nudge の秒数で調整できます。 */
.sticky-promo .promo-action{animation:nudge 4.2s ease-in-out infinite}
@keyframes nudge{0%,69%,91%,100%{transform:translateY(0)}74%,85%{transform:translateY(-5px)}79%{transform:translateY(3px)}}
.tiny-promo{right:7px;top:94px;width:230px;background:#fffdf7;color:#233b4a;border:1px solid #a3aeb4}
.tiny-promo .promo-close{min-width:0;min-height:0;width:15px;height:15px;padding:0;font-size:11px}
.gross-promo{left:7px;bottom:53px;width:256px;background:#eafea7;color:#26371c;border:2px solid #546625}
.gross-promo strong{font-size:1.22rem}
.video-promo{right:7px;bottom:53px;width:260px;background:#191b27;color:#fff}
.video-promo .promo-action{display:block}
.video-promo .promo-close{min-width:50px}
.cookies-promo{left:7px;bottom:7px;width:calc(100% - 14px);background:white;color:#1c3144;border:1px solid #8695a6}
.cookies-promo .promo-close{min-height:24px;font-size:.7rem;background:transparent;border:0;text-decoration:underline;color:#475a69}
/* スマホでは data-app に応じて片方の画面だけを表示します。 */
@media(max-width:690px){
  .stage.playing{grid-template-columns:minmax(0,410px);padding-bottom:66px}
  .stage.playing[data-app="news"] .phone,.stage.playing[data-app="chat"] .pc{display:none}
  .stage.playing[data-app="chat"] .phone,.stage.playing[data-app="news"] .pc{animation:app-in .24s ease-out}
  .stage.playing .phone{width:min(100%,410px)}
  .stage.playing .messages{height:clamp(168px,38dvh,330px)}
  .screen{height:clamp(280px,calc(100dvh - 175px),620px)}
  .app-switch:not([hidden]){display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;gap:8px;background:#141b22;padding:7px 12px max(7px,env(safe-area-inset-bottom))}
}
@keyframes app-in{from{transform:translateY(12px) scale(.98);opacity:.5}}

.scroll.is-locked{overflow:hidden;touch-action:none}
.modal-promo{z-index:3;touch-action:none}
.support-promo{right:9px;bottom:57px;width:260px;background:#e6f7ff;color:#183852;border:1px solid #4781a0}
.survey-promo{right:8px;top:72px;width:265px;background:#fff;color:#44284c;border:2px solid #a666af}
.survey-promo .promo-action{margin:3px 4px 0 0}
.install-promo{left:7px;bottom:7px;width:calc(100% - 14px);background:#17304c;color:white;border:1px solid #75a5d1}
.next-promo{background:transparent}
.story-links-title{margin:12px 0 0}
/* 画像広告のサイズ。画像は pictures/ フォルダーに入っています。 */
.promo-photo{display:block;width:100%;height:auto;aspect-ratio:2.4/1;object-fit:cover;object-position:center 35%;border-radius:4px;margin:5px 0}
.native .promo-photo{margin-top:7px}
.photo-promo{bottom:53px;right:7px;width:310px;background:#fff;color:#173648;border:1px solid #8096a3}
.photo-promo .photo-button{width:100%;padding:0;border:0;background:none;text-align:left;color:inherit}
.photo-promo .photo-button strong{padding:2px 0;color:#184364}
.photo-promo .photo-button:hover strong{text-decoration:underline}

a.native,a.promo-action,a.photo-button{display:block;text-decoration:none}
a.promo-action{display:inline-block}
.link-toast{z-index:2;bottom:7px;left:7px;width:calc(100% - 14px);background:#fff;color:#253d4d;border:1px solid #8d9eab;animation:slide .42s ease-out}
.link-toast .promo-title{margin-bottom:3px}
.link-toast a{display:block;color:#244f72;text-underline-offset:3px}
.runaway-modal .promo-card{position:relative;overflow:hidden;padding-right:52px}
.runaway-modal .promo-title{min-height:32px}
.runaway-modal .promo-close{position:absolute;z-index:1;top:14px;right:12px}
@media(prefers-reduced-motion:reduce){.link-toast{animation:none}}
/* 同じファイルを別タブで開いた際の商品ページ */
.item-page{width:min(calc(100% - 32px),680px);margin:32px auto;background:#fff;color:#192b33;border-radius:10px;overflow:hidden}
.item-page .promo-photo{width:100%;display:block;aspect-ratio:2;object-fit:cover;border-radius:0;margin:0}
.item-copy{padding:clamp(18px,5vw,38px)}
.item-copy h1{line-height:1.25;margin:10px 0 16px}
.item-copy small{color:#53666d}
</style>
</head>
<body>
<header class="top"><div class="brand">どこ押すねん</div><div class="stats" id="stats" hidden><span>経過 <b id="time">00:00</b></span><span>広告クリック <b id="hits">0</b>回</span></div></header>
<!-- ゲーム本体。スマホとニュースは別の領域として作り、CSSで切り替えます。 -->
<main id="stage" class="stage" data-app="chat">
  <section class="phone" id="phone" aria-label="スマホのチャット">
    <div class="phone-top"><div class="notch" aria-hidden="true"></div><div class="contact"><span class="avatar" aria-hidden="true">友</span>友人とのチャット</div></div>
    <div class="messages" id="messages" role="log" aria-live="polite"></div>
    <form id="reply" class="reply" hidden>
      <div id="fields"></div>
      <button id="send" class="primary" type="submit">送信</button>
    </form>
    <div id="result" class="result" hidden><p id="score"></p><button id="retry" type="button" class="primary">もう一度遊ぶ</button></div>
  </section>
  <section id="pc" class="pc" aria-label="PCのブラウザー" hidden>
    <div class="chrome">
      <button type="button" id="back" aria-label="前のページへ戻る" disabled>←</button>
      <div id="address" class="location-bar"></div>
    </div>
    <div class="screen" id="screen">
      <div class="scroll" id="scroll">
        <div class="mast"><a class="site-link" href="#home" data-page="home">夕刊みなと</a><span>地域のニュース</span></div>
        <nav class="nav" id="sections" aria-label="ニュースのカテゴリ"></nav>
        <article id="page" aria-label="夕刊みなとの記事"></article>
      </div>
      <!-- ニュースの上に表示する広告。クリック先もこのHTMLで表示します。 -->
      <div class="layer" id="layer" aria-label="サイト内広告"></div>
    </div>
  </section>
</main>
<nav class="app-switch" id="app-switch" aria-label="アプリ切り替え" hidden>
  <button type="button" id="app-chat" aria-controls="phone" aria-pressed="true">チャット</button>
  <button type="button" id="app-news" aria-controls="pc" aria-pressed="false">ニュース</button>
</nav>
<script>
'use strict';
// 調整用の数値です。確率は 0〜1、距離は px、時間はミリ秒です。
const settings = {
  maxPopupKinds: 4,         // 画面に重ねられる広告の種類数。記事内の広告は別。
  adFrequency: 0.60,         // 以前の出現頻度を1とした倍率。
  scrollAdChance: 0.35,       // 一覧を一定距離だけ下へ読むたびに抽選。0で無効、1で毎回当選。
  scrollAdDistance: 350,      // 何px進むごとに抽選するか。
  scrollAdCooldown: 5000,     // モーダルを閉じてから次のスクロール広告を出せるまで。
  firstAdDelay: [2300, 4100], // ニュースを開いてから最初のタイマー広告までの範囲。
  timedAdDelay: [3100, 5700]  // 2回目以降のタイマー広告の間隔。
};

const get = id => document.getElementById(id);
const pc = get('pc');
const page = get('page');
const scroll = get('scroll');
const layer = get('layer');
const messages = get('messages');
// ニュースのカテゴリと記事データ。記事のキーは URL と関連記事にも使います。
const categories = {events:'イベント', transit:'交通', city:'暮らし'};
const articles = {
  festival:{category:'events', title:'みなと灯り祭、強風で入場に一部変更', date:'きょう 12:10', paragraphs:['港公園で明日開かれる「みなと灯り祭」は、点灯を予定通り18:00から行う。強風の予報を受け、ゲート別の開場時刻と再入場の扱いは別のお知らせにまとめた。'], related:['gates','festivalOld']},
  gates:{category:'events', title:'灯り祭の入場案内【当日版】', date:'きょう 12:30更新', paragraphs:['実行委員会は、昨日発表した開場時刻を更新した。北側ゲートは15:00、南側ゲートは{0}に開く。','再入場の受付は{1}のみ。いったん外に出た場合は、指定のゲートへ向かう。'], related:['festival']},
  festivalOld:{category:'events', title:'灯り祭、両ゲート15時開場を予定', date:'きのう 17:00', paragraphs:['発表当初は北側・南側とも15:00に開場する予定だった。強風への対応は決まり次第、当日版に掲載する。'], related:['gates']},
  market:{category:'events', title:'日曜の朝市、雨天のため屋内に変更', date:'きょう 10:25', paragraphs:['港町朝市は日曜も開催する。会場は屋外の中央広場から、市民交流館に変更された。出店者と一般来場者で入口が異なる。'], related:['marketGuide']},
  marketGuide:{category:'events', title:'港町朝市の来場案内【雨天版】', date:'きょう 11:15更新', paragraphs:['一般来場者の入場は{1}から。市民交流館の{0}を利用する。','出店者の搬入は一般入口とは別の搬入口で08:30から受け付ける。'], related:['market']},
  shuttle:{category:'transit', title:'灯り祭の臨時バス、駅前の乗り場を変更', date:'きょう 09:00', paragraphs:['港中央駅前の工事に伴い、明日の臨時バスは通常のバス停を使用しない。会場行きと駅前行きで時刻が異なる。'], related:['timetable','festival']},
  timetable:{category:'transit', title:'臨時バスの時刻表【明日・変更後】', date:'きょう 13:30更新', paragraphs:['港中央駅 → 港公園。乗り場は駅前{1}。初便は{0}、最終便は17:20。','港公園 → 港中央駅。乗り場は公園北口。初便は18:20、最終便は21:10。'], related:['shuttle']},
  ferry:{category:'transit', title:'夕凪フェリー、土曜は一部の便を運休', date:'きょう 08:45', paragraphs:['潮見港と南島を結ぶ夕凪フェリーは、船の点検で土曜の朝の便を一部運休する。日曜は通常どおり。'], related:['ferryNotice']},
  ferryNotice:{category:'transit', title:'夕凪フェリー 土曜の臨時時刻表', date:'きょう 13:00更新', paragraphs:['潮見港 → 南島。07:50便は運休。運航する最初の便は{0}。','南島 → 潮見港。08:55便は通常どおり運航する。'], related:['ferry']},
  library:{category:'city', title:'港図書館、改修で月曜から休館', date:'きょう 09:40', paragraphs:['港図書館は来週月曜から改修工事に入る。休館中も一部のサービスが使える。市の案内で受付場所と対象を確認できる。'], related:['libraryGuide']},
  libraryGuide:{category:'city', title:'港図書館の休館中に使えるサービス', date:'きょう 12:05更新', paragraphs:['借りた本は{0}へ。CD・DVDは破損防止のため、{1}のカウンターで返却を受け付ける。','予約本の受け取りは市民交流館の臨時窓口で行う。'], related:['library']},
  water:{category:'city', title:'水道工事、青葉町の断水予定を更新', date:'きょう 10:10', paragraphs:['青葉町の水道工事は来週火曜に行われる。作業時間、各地区の断水時間、給水車の受付時間はそれぞれ異なる。'], related:['waterGuide']},
  waterGuide:{category:'city', title:'青葉町の断水と給水所【地区別】', date:'きょう 14:15更新', paragraphs:['青葉町1丁目の断水は10:00〜12:00。青葉町2丁目の断水は{0}〜15:00。','給水車は{1}の正面入口前で12:30から待機する。工事全体の作業時間は09:00〜17:00。'], related:['water']}
};

function element(tag, className, text) {
  const item = document.createElement(tag);
  item.className = className;
  if (text !== undefined) item.textContent = text;
  return item;
}
function button(className, text) {
  const item = element('button', className, text);

  return item;
}
// ゲーム内の setTimeout はここを通し、クリアや再挑戦の直後に広告が残らないようにします。
function later(callback, delay) {
  const id = setTimeout(() => {
    scheduled.delete(id);
    callback();
  }, delay);
  scheduled.add(id);
  return id;
}
function clearTimers() {
  for (const id of scheduled) clearTimeout(id);
  scheduled.clear();
}
function randomInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}
function shuffle(values) {
  const items = [...values];
  for (let index = items.length - 1; index > 0; index--) {
    const other = randomInt(0, index);
    [items[index], items[other]] = [items[other], items[index]];
  }
  return items;
}
// チャットの描画と、リンクを押してからゲームを開始する処理です。
function addMessage(who, text) {
  const bubble = element('div', who === 'me' ? 'bubble me' : 'bubble');
  if (who === 'link') {
    const link = element('a', '', text);
    link.href = '#home';
    link.addEventListener('click', event => {
      event.preventDefault();
      if (!introDone) finishIntro();
      if (started === null) start();
      else revealPc();
      spawnLinkToast();
    });
    bubble.append(link, element('small', '', 'yukan-minato.test/local'));
  } else {
    bubble.textContent = text;
  }
  messages.append(bubble);
  messages.scrollTop = messages.scrollHeight;
}
function finishIntro() {
  if (introDone) return;
  clearTimers();
  introDone = true;
  addMessage(...intro.at(-1));
}
function playIntro() {
  intro.forEach((entry, index) => {
    later(() => {
      if (index === intro.length - 1) finishIntro();
      else addMessage(...entry);
    }, 240 + index * 770);
  });
}
function readTime() {
  const seconds = Math.max(0, Math.floor((performance.now() - started) / 1000));
  return [Math.floor(seconds / 60), seconds % 60].map(n => String(n).padStart(2, '0')).join(':');
}

  get('app-chat').setAttribute('aria-pressed', String(app === 'chat'));

  if (matchMedia('(max-width: 690px)').matches) window.scrollTo(0, 0);
}
function revealPc() {
  switchApp('news');

  target.focus({preventScroll:true});
}
function start() {
  started = performance.now();
  get('stage').classList.add('playing');
  get('stats').hidden = false;
  get('reply').hidden = false;
  get('app-switch').hidden = false;
  pc.hidden = false;
  trail.push({id:'home', scroll:0});
  render();
  revealPc();
  if (Math.random() < .8 * settings.adFrequency) spawnSticky();
  scheduleAd(randomInt(...settings.firstAdDelay));
}

  row.append(element('small', '', article.date + ' ・ ' + categories[article.category]), element('strong', '', article.title + ' →'));
  return row;
}
function makeSlot() {
  const slot = element('div', 'slot inline');
  slot.dataset.slot = 'inline';
  return slot;
}
// トップには全記事、カテゴリには該当記事を表示します。順番は1プレイの間固定です。
function buildPage(id) {
  const article = articles[id];
  const category = article?.category ?? (categories[id] ? id : null);
  const title = article?.title ?? categories[id] ?? 'ニュース一覧';
  const crumb = element('nav', 'crumb');
  crumb.setAttribute('aria-label','パンくずリスト');
  if (id === 'home') {
    crumb.append(element('span', '', 'トップ'));
  } else {
    crumb.append(siteLink('home', 'トップ'), ' › ');
    if (article) crumb.append(siteLink(category, categories[category]), ' › ');
    crumb.append(element('span', '', article ? '記事' : title));
  }
  const heading = element('h1', '', title);
  heading.tabIndex = -1;
  page.replaceChildren(crumb, heading);
  const slot = makeSlot();
  if (article) {
    page.append(element('p', 'meta', article.date + ' ／ 夕刊みなと編集部'));
    const story = element('section', 'story');
    const paragraphs = article.paragraphs.map(text => element('p', '', text.replace(/\{(\d+)\}/g, (_, index) => roundAnswers[id][index])));
    story.append(paragraphs[0], slot, ...paragraphs.slice(1));
    page.append(story);
    if (article.related.length) page.append(element('h2', 'story-links-title', '関連記事'), ...article.related.map(newsRow));
    return;
  }
  const ids = category ? feed.filter(key => articles[key].category === category) : feed;
  const firstRows = ids.slice(0, 2).map(newsRow);
  page.append(...firstRows, slot, ...ids.slice(2).map(newsRow));
}
function render(restore = false) {
  const current = trail.at(-1);
  const id = current.id;
  buildPage(id);
  get('address').textContent = 'yukan-minato.test' + (id === 'home' ? '/' : categories[id] ? '/section/' + id : '/news/' + id);
  get('back').disabled = trail.length === 1;
  const slot = page.querySelector('[data-slot]');
  if (!finished && Math.random() < .87 * settings.adFrequency) {
    // 記事に関係のない広告と、記事に似せた広告の両方を混ぜます。
    const candidates = Math.random() < 0.65 ? photoAdIds : ['gate','map','lottery','gross'];
    const adId = candidates[randomInt(0, candidates.length - 1)];
    const item = adLink('native', adId);
    item.append(element('span', 'promo-label', '広告'));
    if (adImages[adId]) item.append(makeAdPhoto(adId));
    item.append(element('strong', '', ads[adId][2]), element('small', '', ads[adId][0]));
    slot.append(item);
  }
  page.querySelector('h1').focus({preventScroll:true});
  scroll.scrollTop = restore ? current.scroll : 0;
  listHighWater = scroll.scrollTop;
  listProgress = 0;
}
function navigate(id) {
  if (trail.at(-1).id === id) {
    scroll.scrollTop = 0;
    listHighWater = listProgress = 0;
    return;
  }
  trail.at(-1).scroll = scroll.scrollTop;
  trail.push({id, scroll:0});
  render();
}
function back() {
  if (trail.length < 2) return;
  trail.pop();
  render(true);
}
function closeButton(label, remove, escapes = 0) {
  const item = button('promo-close', '×');
  item.setAttribute('aria-label', label);
  item.addEventListener('click', event => {
    if (event.detail > 0 && escapes > 0) {
      dodgeCloseButton(item, escapes--);
      return;
    }
    remove();
  });
  return item;
}
// 「閉じる」が押されると、カードの内側で二回転しながら反対の角へ飛びます。
function dodgeCloseButton(item, escapes) {
  const card = item.closest('.promo-card');
  const fromX = item.offsetLeft;
  const fromY = item.offsetTop;
  const maxX = card.clientWidth - item.offsetWidth - 12;
  const maxY = card.clientHeight - item.offsetHeight - 12;
  const toX = escapes === 2 ? 12 : maxX;
  const toY = maxY;
  item.style.right = 'auto';
  item.style.left = toX + 'px';
  item.style.top = toY + 'px';
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !item.animate) return;
  const deltaX = fromX - toX;
  const deltaY = fromY - toY;
  item.getAnimations().forEach(animation => animation.cancel());
  item.animate([
    {transform:'translate(' + deltaX + 'px,' + deltaY + 'px) rotate(0)'},
    {transform:'translate(' + deltaX * .45 + 'px,' + -Math.min(48, toY) + 'px) rotate(235deg) scale(.65)'},
    {transform:'translate(0,0) rotate(720deg) scale(1)'}
  ], {duration:520, easing:'cubic-bezier(.2,.7,.25,1)'});
}
function adHeader(title, close) {
  const header = element('div', 'promo-title');
  header.append(element('span', '', title), close);
  return header;
}
function adAction(id, text = ads[id][2]) {
  return adLink('promo-action', id, text);
}
function makeAdPhoto(id) {
  const image = element('img', 'promo-photo');
  image.src = 'pictures/' + adImages[id];
  image.alt = '';
  return image;
}
// 偽ウイルス警告は、表示待ちのウィンドウも含めて1種類分の枠を使います。
function hasPopupRoom() {
  const otherPopups = layer.children.length - layer.querySelectorAll('.virus').length;
  return otherPopups + Number(Boolean(burst)) < settings.maxPopupKinds;
}
function spawnPhotoAd() {
  if (!hasPopupRoom()) return;
  if (layer.querySelector('.photo-promo')) return;
  const id = photoAdIds[randomInt(0, photoAdIds.length - 1)];
  const card = element('div', 'promo-card photo-promo');
  card.dataset.transient = '';
  const creative = adLink('photo-button', id);
  creative.append(makeAdPhoto(id), element('strong', '', ads[id][2]));
  card.append(adHeader('広告 ・ ' + ads[id][0], closeButton('画像広告を閉じる', () => card.remove())), creative);
  layer.append(card);
}
// 記事やカテゴリのリンクを押した直後だけ出る広告。閉じるまで画面下に残ります。
function spawnLinkToast() {
  if (!hasPopupRoom() || finished || layer.querySelector('.link-toast') || Math.random() >= settings.adFrequency) return;
  const card = element('div', 'promo-card link-toast');
  const close = closeButton('トースト広告を閉じる', () => card.remove());
  card.append(adHeader('スポンサーからのお知らせ', close), adLink('', 'linkToast', ads.linkToast[2]));
  layer.append(card);
}
function spawnSticky() {
  if (!hasPopupRoom() || layer.querySelector('.sticky-promo')) return;
  const item = element('div', 'promo-card sticky-promo');
  item.append(adAction('map', '会場マップ　広告'), closeButton('追従バナーを閉じる', () => item.remove()));
  layer.append(item);
}
// モーダル中はスクロール位置を保持し、慣性スクロールやキー操作でも裏が動かないようにします。
function lockScroll() {
  lockedScrollTop ??= scroll.scrollTop;
  scroll.classList.add('is-locked');
  scroll.inert = true;
}
function unlockScroll() {
  if (lockedScrollTop !== null) {
    scroll.scrollTop = lockedScrollTop;
    scrollAdReadyAt = performance.now() + settings.scrollAdCooldown;
    lockedScrollTop = null;
  }
  scroll.classList.remove('is-locked');
  scroll.inert = false;
}
function tryScrollAd() {
  const position = scroll.scrollTop;
  if (lockedScrollTop !== null) {
    if (position !== lockedScrollTop) scroll.scrollTop = lockedScrollTop;
    return;
  }
  const id = trail.at(-1)?.id;
  if (!id || finished || Object.hasOwn(articles, id) || burst) return;
  // 同じ箇所を上下に揺らしても再抽選しません。新たに下へ読んだ距離だけを数えます。
  if (position <= listHighWater) return;
  const distance = position - listHighWater;
  listHighWater = position;
  if (performance.now() < scrollAdReadyAt) return;
  listProgress += distance;
  if (listProgress < settings.scrollAdDistance) return;
  listProgress %= settings.scrollAdDistance;
  if (Math.random() < settings.scrollAdChance * settings.adFrequency) spawnCard('scrollOffer');
}
// 一度出した広告は閉じられるまで残し、同じ形式の広告は重ねて出しません。
function spawnCard(kind) {
  if (!hasPopupRoom() || layer.querySelector('[data-kind="' + kind + '"]')) return;
  const isModal = kind === 'modal' || kind === 'scrollOffer';
  const config = {
    scrollOffer:['scrollOffer','スポンサーからのお知らせ','スクロールの途中ですが','続きをご覧になる前に、夕刊みなと読者クラブをご案内します。'],
    support:['support','サポート窓口　● オンライン','なにかお探しですか？','アシスタントから新着メッセージがあります。'],
    survey:['survey','30秒で終わる読者アンケート','ネットで買い物をする前に、口コミを読みますか？','どちらかを選んで先に進んでください。'],
    install:['install','夕刊みなと 公式アプリ','アプリで快適に読む','ブラウザーで読むたび、この案内が表示されます。'],
    modal:['subscribe','スポンサーからのお知らせ','記事の続きを見る前に','夕刊みなとプラスの無料体験受付中。'],
    slide:['push','yukan-minato.test','通知を表示しますか？','イベントの更新を今すぐ受け取れます。'],
    moving:['sale','広告 ／ 本日限り','＼ 港が見えるほど光る ／','超特価ランタン 99% OFF'],
    tiny:['tiny','広告 ／ 当選通知','おめでとうございます！','このページを見た方だけに特別な賞品。'],
    gross:['gross','広告 ／ おなら研究所','屁の音がデカすぎて草','便座にヒビが入るほどの爆音。その理由とは？'],
    video:['video','広告 ／ 自動再生','▶ おすすめ動画を再生中','数秒後にスキップできます。'],
    cookies:['cookies','プライバシー設定','クッキーを許可しますか？','あなたにぴったりの広告を決めるために使います。']
  }[kind];
  const [id, label, title, copy] = config;
  const wrapper = isModal ? element('div', kind === 'modal' ? 'modal-promo runaway-modal' : 'modal-promo') : null;
  const card = element('div', 'promo-card ' + (isModal ? '' : kind + '-promo'));
  const top = wrapper ?? card;
  top.dataset.transient = '';
  top.dataset.kind = kind;
  const close = closeButton('広告を閉じる', () => {
    const focused = top.contains(document.activeElement);
    top.remove();
    if (isModal) unlockScroll();
    if (focused) page.querySelector('h1').focus({preventScroll:true});
  }, kind === 'modal' ? 2 : 0);
  if (kind === 'install') close.textContent = 'あとで';
  if (kind === 'cookies') close.textContent = '興味ないので断る';
  if (kind === 'video') {
    close.disabled = true;
    close.textContent = '3秒';
    later(() => { close.textContent = '2秒'; }, 1000);
    later(() => { close.textContent = '1秒'; }, 2000);
    later(() => { close.textContent = 'スキップ'; close.disabled = false; }, 3000);
  }
  card.append(adHeader(label, close), element('strong', '', title), element('p', '', copy));
  if (kind === 'survey') card.append(adAction(id, '読む'), adAction(id, '読まない'));
  else card.append(adAction(id));
  if (wrapper) wrapper.append(card);
  layer.append(top);
  if (isModal) {
    lockScroll();
    close.focus({preventScroll:true});
  }
}
function stopBurst() {
  if (burst) {
    for (const id of burst.timers) {
      clearTimeout(id);
      scheduled.delete(id);
    }
    burst = null;
  }
  layer.querySelectorAll('.virus').forEach(card => card.remove());
}
// 連続ポップアップ。枚数、重なり方、出現間隔はここで調整できます。
function spawnBurst() {
  if (!hasPopupRoom() || burst) return;
  const batch = {timers:[], total:randomInt(6, 9), spawned:0};
  burst = batch;
  const titles = ['SYSTEM ALERT','保護センター','UPDATE.EXE','PC CHECK','警告 0x0042'];
  for (let index = 0; index < batch.total; index++) {
    const id = later(() => {
      if (burst !== batch) return;
      batch.spawned++;
      const card = element('div', 'promo-card virus');
      card.dataset.transient = '';
      const maxX = Math.max(0, layer.clientWidth - 236);
      const maxY = Math.max(0, layer.clientHeight - 126);
      card.style.left = Math.min(maxX, 4 + index * Math.round(maxX / batch.total) + randomInt(0, 8)) + 'px';
      card.style.top = Math.min(maxY, 6 + index * Math.min(37, Math.floor(maxY / batch.total)) + randomInt(0, 6)) + 'px';
      const close = closeButton('警告ウィンドウを閉じる', () => {
        card.remove();
        const remaining = layer.querySelectorAll('.virus');
        if (remaining.length) remaining[remaining.length - 1].querySelector('.promo-close').focus({preventScroll:true});
        else {
          if (batch.spawned === batch.total) stopBurst();
          page.querySelector('h1').focus({preventScroll:true});
        }
      });
      const body = element('div', 'body');
      body.append(element('strong', '', '⚠ 異常を ' + randomInt(12, 99) + ' 件検出'), adAction('virus'));
      card.append(adHeader(titles[index % titles.length], close), body);
      layer.append(card);
    }, index * randomInt(100, 190));
    batch.timers.push(id);
  }
}
function shiftArticle(kind) {
  const slot = page.querySelector('[data-slot="inline"]');
  if (slot.querySelector('[data-delayed]')) return;
  const id = kind === 'next' ? 'next' : 'gate';
  const item = adLink(kind === 'next' ? 'native next-promo' : 'native', id);
  item.dataset.delayed = '';
  item.append(element('span', 'promo-label', '広告'), element('strong', '', ads[id][2]));
  slot.prepend(item);
}
// タイマー広告は全種をランダムに並べて1回ずつ消化し、その後また並べ直します。
function scheduleAd(delay) {
  later(() => {
    if (burst || layer.querySelector('.modal-promo')) {
      scheduleAd(1200);
      return;
    }
    if (Math.random() >= settings.adFrequency) {
      scheduleAd(randomInt(...settings.timedAdDelay));
      return;
    }
    if (!deck.length) deck = shuffle(timedAdKinds);
    const kind = deck.pop();
    if (kind === 'virus') spawnBurst();
    else if (kind === 'shift' || kind === 'next') shiftArticle(kind);
    else if (kind === 'sticky') spawnSticky();
    else if (kind === 'photo') spawnPhotoAd();
    else spawnCard(kind);
    scheduleAd(randomInt(...settings.timedAdDelay));
  }, delay);
}
// 広告のリンクを踏んだ時だけ失点します。×で閉じただけではカウントしません。
function countAdClick() {
  if (finished) return;
  hits++;
  get('hits').textContent = hits;
}
function finish() {
  finished = true;
  clearTimers();
  stopBurst();
  layer.replaceChildren();
  unlockScroll();
  page.querySelectorAll('[data-slot]').forEach(slot => slot.replaceChildren());
  get('reply').hidden = true;
  get('result').hidden = false;
  const time = readTime();
  get('time').textContent = time;
  get('score').textContent = 'クリア！　' + time + ' ／ 広告クリック ' + hits + '回' + (hits === 0 ? ' ／ ノーミス' : '');
  get('retry').focus({preventScroll:true});
}
// 1プレイの状態を初期化します。記事と依頼は別々に抽選します。
function reset() {
  clearTimers();
  stopBurst();
  layer.replaceChildren();
  unlockScroll();
  page.replaceChildren();
  messages.replaceChildren();
  trail.length = 0;
  feed = shuffle(Object.keys(articles));
  randomizeAnswers();
  listHighWater = listProgress = scrollAdReadyAt = 0;
  deck = [];
  introDone = false;
  started = null;
  finished = false;
  hits = wrongReplies = 0;
  get('hits').textContent = '0';
  get('time').textContent = '00:00';
  get('stage').classList.remove('playing');
  get('stats').hidden = pc.hidden = get('reply').hidden = get('result').hidden = true;
  get('app-switch').hidden = true;
  switchApp('chat');
  if (!missionDeck.length) {
    const previous = mission;
    missionDeck = shuffle(missions);
    if (missionDeck.at(-1) === previous) missionDeck.unshift(missionDeck.pop());
  }
  mission = missionDeck.pop();
  intro = [['friend',mission.setup],['me','うん、どうしたん？'],['friend',mission.ask],['link','夕刊みなと｜ニュース一覧'],['me','見てみる。ちょっと待ってね。']];
  buildFields();
  window.scrollTo(0, 0);
  playIntro();
}
function buildFields() {
  get('fields').replaceChildren(...mission.fields.map(([label, type, options], index) => {
    const field = element('div','field');
    const title = element('label','',label);
    const control = element(type === '時刻' ? 'input' : 'select', '');
    control.id = title.htmlFor = 'answer-' + index;
    control.required = true;
    if (type === '時刻') {
      control.placeholder = '例 11:00';
      control.autocomplete = 'off';
      control.maxLength = 25;
    } else {
      const placeholder = element('option', '', '選択してください');
      placeholder.value = '';
      control.append(placeholder, ...options.map(option => element('option', '', option)));
    }
    field.append(title, control);
    return field;
  }));
}
function normalizeTime(raw) {
  const value = raw.normalize('NFKC').replace(/\s/g, '');
  const match = /^(午前|午後)?(\d{1,2})(?:[:時](\d{1,2})分?|時)(AM|PM)?(?:から)?[。！!]?$/i.exec(value);
  if (!match) return '';
  const [, prefix, hours, minutes = '0', suffix] = match;
  if (prefix && suffix) return '';
  const period = prefix || suffix?.toUpperCase();
  let hour = Number(hours);
  const minute = Number(minutes);
  if (minute > 59 || (period ? hour < 1 || hour > 12 : hour > 23)) return '';
  if (period) hour = hour % 12 + (period === '午後' || period === 'PM' ? 12 : 0);
  return [hour, minute].map(part => String(part).padStart(2, '0')).join(':');
}
// 操作イベント。スクロール広告は記事詳細ではなく、トップとカテゴリ一覧だけで抽選します。
scroll.addEventListener('scroll', tryScrollAd, {passive:true});
get('sections').append(siteLink('home','トップ'), ...Object.entries(categories).map(([id, label]) => siteLink(id,label)));
pc.addEventListener('click', event => {
  const item = event.target.closest('[data-page], [data-offer]');
  if (!item) return;
  if (item.dataset.page) {
    event.preventDefault();
    navigate(item.dataset.page);
    spawnLinkToast();
  }
  if (item.dataset.offer) countAdClick();
});
pc.addEventListener('auxclick', event => {
  if (event.button === 1 && event.target.closest('[data-offer]')) countAdClick();
});
pc.addEventListener('keydown', event => {
  if (event.key === 'Escape') layer.querySelector('.modal-promo .promo-close')?.click();
});
get('back').addEventListener('click', () => {
  if (lockedScrollTop !== null) layer.querySelector('.modal-promo .promo-close')?.click();
  else back();
});
get('app-chat').addEventListener('click', () => switchApp('chat'));
get('app-news').addEventListener('click', revealPc);
// 回答欄の値を正答と照合します。時刻は全角や「午後4時30分」も正規化します。
get('reply').addEventListener('submit', event => {
  event.preventDefault();
  if (started === null || finished) return;
  const replies = mission.fields.map((_, index) => get('answer-' + index).value.trim());
  if (replies.some(value => !value)) return;
  addMessage('me', mission.fields.map(([label], index) => label + '　' + replies[index]).join(' ／ '));
  const answers = roundAnswers[mission.article];
  const correct = mission.fields.every(([, type], index) => {
    const reply = type === '時刻' ? normalizeTime(replies[index]) : replies[index];
    return reply === answers[index];
  });
  if (correct) {
    addMessage('friend', '助かった！ 調べてくれてありがとう。');
    finish();
  } else {
    const line = wrongReplies++ === 0 ? 'どこか違うみたい。記事の条件と見比べてみてくれへん？' : mission.hint;
    addMessage('friend', line);
  }
});
get('retry').addEventListener('click', reset);
setInterval(() => {
  if (started !== null && !finished) get('time').textContent = readTime();
}, 250);
// ?item= が有効なときは、ゲームを始めずに商品の内容を表示します。
function showItem(id) {
  const [name, description] = ads[id];
  const card = element('main', 'item-page');
  const copy = element('section', 'item-copy');
  copy.append(element('small', '', '広告'), element('h1', '', name), element('p', '', description),
    element('small', '', 'ゲーム内の架空の広告ページです。'));
  if (adImages[id]) card.append(makeAdPhoto(id));
  card.append(copy);
  document.title = name;
  document.body.replaceChildren(card);
}
const itemId = new URLSearchParams(window.location.search).get('item');
if (Object.hasOwn(ads, itemId)) showItem(itemId);
else reset();
